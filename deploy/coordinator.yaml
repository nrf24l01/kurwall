# Kurwall coordinator configuration.
# Secrets are supplied through environment variables (see compose files).

server:
  http_addr: ":8080"
  grpc_addr: ":9090"
  web_static_dir: "/app/web"
  # Public HTTP origin used by node installers and the dashboard. Set
  # KURWALL_PUBLIC_URL to the address nodes can reach.
  public_url: "http://localhost:8080"
  # Address agents dial. Empty derives the host from public_url and the port
  # from grpc_addr. Set KURWALL_GRPC_PUBLIC_ADDR to use a different external
  # host or port for gRPC than public_url (for example grpc.example.com:9090).
  grpc_public_addr: ""
  # TLS server name agents verify for the gRPC endpoint. Keep the default when
  # the coordinator certificate is used; set the external hostname when a proxy
  # serves gRPC with a certificate issued for a different name.
  grpc_server_name: "kurwall-coordinator"
  # Directory served at /agent for the install script and update assets.
  agent_dist_dir: "/app/agent-dist"
  # Persistent directory for the node enrollment CA (generated on first start).
  enrollment_dir: "/var/lib/kurwall/enrollment"
  read_timeout: 30s
  idle_timeout: 120s

postgres:
  host: postgres
  port: 5432
  user: kurwall
  password: ""
  database: kurwall
  sslmode: disable
  max_conns: 10
  connect_timeout: 5s
  statement_timeout: 30s

clickhouse:
  addr: clickhouse:9000
  database: kurwall
  username: kurwall
  password: ""
  dial_timeout: 5s
  max_open_conns: 10
  max_idle_conns: 5
  insert_batch_size: 2000
  insert_interval: 500ms
  query_timeout: 15s

asn:
  enabled: true
  prefix_url_template: "https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS{asn}"
  holder_url_template: "https://stat.ripe.net/data/as-overview/data.json?resource=AS{asn}"
  refresh_interval: 12h
  retry_interval: 5m
  request_timeout: 10s
  max_prefixes: 20000
  catalog_enabled: true
  catalog_url: "https://iptoasn.com/data/ip2asn-combined.tsv.gz"
  catalog_refresh_interval: 168h
  catalog_retry_interval: 5m
  catalog_timeout: 90s

tls:
  enabled: true
  ca_file: /etc/kurwall/tls/ca.crt
  cert_file: /etc/kurwall/tls/coordinator.crt
  key_file: /etc/kurwall/tls/coordinator.key
  require_client_cert: true

agent:
  tls_inspector_ports: [443]
  dns_inspection: true
  tls_inspection: true
  batch_max_events: 500
  flush_interval: 1s
  offline_after: 90s

auth:
  # Set KURWALL_API_TOKEN to require a bearer token on the REST API.
  api_token: ""

ingest:
  max_batch_events: 5000
  dedup_retention: 168h
  dedup_timeout: 2m

log:
  level: info
  format: json