# Kurwall node agent configuration.
# APP_CONFIG_PATH must point at this file.

# Empty means "use the common name of the agent certificate".
node_id: ""

coordinator_addr: "kurwall-coordinator.example.com:9090"

tls:
  enabled: true
  ca_file: /etc/kurwall/tls/ca.crt
  cert_file: /etc/kurwall/tls/agent.crt
  key_file: /etc/kurwall/tls/agent.key
  server_name: kurwall-coordinator

state:
  sqlite_path: /var/lib/kurwall/agent.db

inspection:
  dns_enabled: true
  tls_enabled: true
  tls_ports: [443]
  dns_queue_num: 0
  tls_queue_num: 1
  queue_max_len: 2048
  queue_max_packet: 4096
  dns_response_timeout: 5s
  blocked_conn_ttl: 5m
  # Conntrack accounting snapshot used for final byte/packet counters.
  flow_snapshot_interval: 1s

firewall:
  enabled: true
  table_name: kurwall
  block_log_group: 5

docker:
  enabled: true
  socket: /var/run/docker.sock
  refresh_interval: 15s

events:
  batch_max_events: 500
  flush_interval: 1s
  max_outbox_batches: 100000
  retry_min: 1s
  retry_max: 60s
  send_timeout: 30s
  max_attempts: 10
  heartbeat_interval: 15s
  reconnect_max: 60s

metrics:
  addr: "127.0.0.1:9877"

log:
  level: info
  format: json