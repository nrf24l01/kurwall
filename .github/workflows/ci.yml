name: CI

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "proto/**"
      - "migrations/**"
      - "web/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "proto/**"
      - "migrations/**"
      - "web/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go format check
        run: test -z "$(gofmt -l cmd internal gen)"

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Build coordinator
        run: CGO_ENABLED=0 go build -trimpath -o build/coordinator ./cmd/coordinator

      - name: Build agent (CGO/SQLite)
        run: CGO_ENABLED=1 go build -tags "sqlite_omit_load_extension" -trimpath -o build/kurwall-agent ./cmd/agent

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Type-check and build dashboard
        working-directory: web
        run: bun run build

  image:
    name: Build and push coordinator image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/coordinator" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.coordinator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=coordinator
          cache-to: type=gha,mode=max,scope=coordinator
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.run_started_at }}

      - name: Build agent image (validation, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          push: false
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent